services:
  # ─── Backend API ────────────────────────────────────────────────
  - type: web
    name: quietguard-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: quietguard-db
          property: connectionString
      # The following must be set manually in the Render Dashboard:
      - key: SESSION_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_FROM_EMAIL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
    autoDeploy: true

  # ─── Frontend SPA ────────────────────────────────────────────────
  - type: web
    name: quietguard-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: quietguard-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    autoDeploy: true

  # ─── PostgreSQL Database ──────────────────────────────────────────
databases:
  - name: quietguard-db
    databaseName: quietguard
    user: quietguard_user
    plan: free
